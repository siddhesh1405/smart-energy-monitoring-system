name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 🔥 Install library from TestPyPI (BUILD TIME)
    - name: Install library
      run: |
        pip install --index-url https://test.pypi.org/simple/ energy-anomaly-engine

    # 🔥 Package Lambda with pip (IMPORTANT)
    - name: Package Lambda
      run: |
        mkdir package
        pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple --target ./package energy-anomaly-engine
        cp -r backend/processEnergyData/* package/
        cd package
        zip -r function.zip .
        cd ..

    - name: Install AWS CLI
      run: |
        pip install awscli

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Verify AWS Identity
      run: aws sts get-caller-identity

    # 🔥 Deploy Lambda
    - name: Deploy Lambda
      run: |
        aws lambda update-function-code \
          --function-name processEnergyData \
          --zip-file fileb://package/function.zip

    # 🔥 Deploy Frontend to S3
    - name: Deploy Frontend
      run: |
        aws s3 sync frontend s3://energy-dashboard-siddhesh --delete