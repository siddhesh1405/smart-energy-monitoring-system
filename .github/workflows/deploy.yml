name: Deploy Smart Energy System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install zip
      run: sudo apt-get install zip

    - name: Package Lambdas
      run: |
        for dir in processEnergyData getEnergyReadings updateEnergyReading deleteEnergyReading subscribeEmail
        do
          cd backend/$dir
          cp -r ../common/energy_anomaly_engine .
          zip -r function.zip .
          cd -
        done

    - name: Deploy processEnergyData
      uses: appleboy/lambda-action@master
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_KEY }}
        region: us-east-1
        function_name: processEnergyData
        zip_file: backend/processEnergyData/function.zip

    - name: Deploy getEnergyReadings
      uses: appleboy/lambda-action@master
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_KEY }}
        region: us-east-1
        function_name: getEnergyReadings
        zip_file: backend/getEnergyReadings/function.zip

    - name: Deploy updateEnergyReading
      uses: appleboy/lambda-action@master
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_KEY }}
        region: us-east-1
        function_name: updateEnergyReading
        zip_file: backend/updateEnergyReading/function.zip

    - name: Deploy deleteEnergyReading
      uses: appleboy/lambda-action@master
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_KEY }}
        region: us-east-1
        function_name: deleteEnergyReading
        zip_file: backend/deleteEnergyReading/function.zip

    - name: Deploy subscribeEmail
      uses: appleboy/lambda-action@master
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_KEY }}
        region: us-east-1
        function_name: subscribeEmail
        zip_file: backend/subscribeEmail/function.zip
    
    - name: Deploy Frontend
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --delete
      env:
        AWS_S3_BUCKET: energy-dashboard-siddhesh
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        AWS_REGION: us-east-1
        SOURCE_DIR: frontend